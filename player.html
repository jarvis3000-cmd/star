<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud TV – Loading...</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
  </style>
</head>
<body>

<div>Loading Stream...</div>

<script>
const params = new URLSearchParams(window.location.search);

const url = params.get("url");
const keyId = params.get("keyId");
const key = params.get("key");

if (!url || !keyId || !key) {
    document.body.innerHTML =
      "<h2>Invalid stream data</h2>";
} else {

    const mpd = encodeURIComponent(url);

    // ✅ DIRECT REDIRECT (NO IFRAME)
    window.location.replace(
      `https://ultron3000.github.io/star-sports/s-mpd.html?url=${mpd}&keyId=${keyId}&key=${key}`
    );
}
</script>

</body>
</html>
