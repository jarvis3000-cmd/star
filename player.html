<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV</title>

<script>
  // Must run before DOMContentLoaded
  const urlParams = new URLSearchParams(window.location.search);
  const streamName = urlParams.get('name');

  let result = streamName ? streamName.replace(/"/g, '') : '';

  const scriptUrl = `https://waptv.github.io/json/${result}`;

  document.write(`<script src="${scriptUrl}" defer><\/script>`);
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {

    const urlParams = new URLSearchParams(window.location.search);
    const streamId = urlParams.get('id');
    const streamName = urlParams.get('name');

    let result = streamName ? streamName.replace(/"/g, '') : 'jspo';

    if (!streamId) {
        console.error("Stream ID missing");
        return;
    }

    fetch(`https://raw.githubusercontent.com/Shubhamkur/json/refs/heads/main/${result}`)
        .then(response => response.json())
        .then(data => {

            const streamInfo = data.find(item => item.id === streamId);

            if (!streamInfo) {
                console.error("Channel not found");
                return;
            }

            const iframe = document.getElementById('stream-iframe');

            if (typeof applyStreamSource === 'function') {
                applyStreamSource(streamInfo, iframe);
            } else {
                console.error("applyStreamSource not loaded");
            }

        })
        .catch(error => {
            console.error("Fetch failed:", error);
        });
});
</script>
</head>

<body style="margin:0;padding:0;background:#000;height:100vh;width:100vw;">
  <iframe id="stream-iframe"
    allow="autoplay; encrypted-media; fullscreen"
