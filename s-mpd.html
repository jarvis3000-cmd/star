<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV</title>

<script>
// Get parameters BEFORE DOM loads
const urlParams = new URLSearchParams(window.location.search);
const streamName = urlParams.get('name');
let result = streamName ? streamName.replace(/"/g, '') : 'jspo';

// Load external JSON helper script like your old working system
const scriptUrl = `https://waptv.github.io/json/${result}`;
document.write(`<script src="${scriptUrl}" defer><\/script>`);
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {

    const urlParams = new URLSearchParams(window.location.search);
    const streamId = urlParams.get('id');
    const streamName = urlParams.get('name');
    let result = streamName ? streamName.replace(/"/g, '') : 'jspo';

    if (!streamId) {
        console.error("Stream ID missing");
        return;
    }

    fetch(`https://raw.githubusercontent.com/Shubhamkur/json/refs/heads/main/${result}`)
    .then(response => response.json())
    .then(data => {

        const streamInfo = data.find(item => item.id === streamId);

        if (!streamInfo) {
            console.error("Channel not found");
            return;
        }

        const iframe = document.getElementById("stream-iframe");

        // 🔥 THIS IS THE KEY FIX
        iframe.src = streamInfo.url3 || streamInfo.url2 || streamInfo.url;

    })
    .catch(error => console.error("Fetch error:", error));

});
</script>

</head>

<body style="margin:0;background:#000;height:100vh;">

<iframe id="stream-iframe"
allow="autoplay; encrypted-media"
allowfullscreen
style="border:none;width:100%;height:100%;">
</iframe>

</body>
</html>
