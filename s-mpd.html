<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Loader</title>
</head>

<body style="margin:0;background:#000;height:100vh;">

<iframe id="streamFrame"
allow="autoplay; encrypted-media"
allowfullscreen
style="border:none;width:100%;height:100%;">
</iframe>

<script>
const params = new URLSearchParams(window.location.search);

// 🔥 FIX 1: force ID to number
const streamId = Number(params.get('id'));
const playlist = params.get('name') || 'jspo';

if (!streamId) {
  console.error('Invalid or missing channel id');
}

fetch(`https://raw.githubusercontent.com/Shubhamkur/json/refs/heads/main/${playlist}`)
.then(res => res.json())
.then(list => {

  // 🔥 FIX 2: numeric comparison
  const channel = list.find(ch => Number(ch.id) === streamId);

  if (!channel) {
    console.error('Channel not found', streamId);
    return;
  }

  // pick first available stream
  const streamUrl = channel.url3 || channel.url2 || channel.url;

  if (!streamUrl) {
    console.error('No stream URL in channel');
    return;
  }

  // 🔥 LOAD YOUR ORIGINAL WORKING PLAYER
  document.getElementById('streamFrame').src =
    `player.html?url=${encodeURIComponent(streamUrl)}`;

})
.catch(err => console.error('Playlist load error:', err));
</script>

</body>
</html>
