<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV Stream</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.compiled.min.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  background:#000;
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
}
</style>
</head>
<body>

<video autoplay playsinline controls></video>

<script>

document.addEventListener('DOMContentLoaded', async () => {

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    alert("Browser not supported");
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const streamUrl = params.get('url');
  const keyId = params.get('keyId');
  const key = params.get('key');

  const video = document.querySelector('video');
  const player = new shaka.Player(video);

  if (keyId && key) {
    player.configure({
      drm: {
        clearKeys: {
          [keyId]: key
        }
      }
    });
  }

  player.addEventListener('error', e => {
    console.error("Shaka Error:", e.detail);
  });

  try {
    await player.load(streamUrl);
    video.muted = true;
    await video.play();
    console.log("Stream playing");
  } catch (err) {
    console.error("Load failed:", err);
  }

});

</script>
</body>
</html>
