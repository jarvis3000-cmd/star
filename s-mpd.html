<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV Stream</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif
}
.shaka-video-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000
}

/* ===== YouTube UI (UNCHANGED) ===== */
.youtube-theme{font-family:Roboto,sans-serif}
.youtube-theme .shaka-controls-button-panel{height:40px}
.youtube-theme .shaka-seek-bar{background:rgba(255,255,255,.2)!important}
.youtube-theme .shaka-played-range{background:#ff0000!important}
.youtube-theme .shaka-buffered-range{background:rgba(255,255,255,.4)!important}

/* Hide loading spinner */
.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg{
  display:none!important
}

/* Mobile fullscreen fix */
@media (max-width:768px){
  video:fullscreen,
  video:-webkit-full-screen{
    object-fit:contain!important;
    background:black
  }
}
</style>
</head>

<body>

<div class="shaka-video-container youtube-theme" data-shaka-player>
  <video autoplay muted playsinline preload="auto"></video>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const params = new URLSearchParams(window.location.search);
  const streamUrl = decodeURIComponent(params.get('url') || '');
  const keyId = params.get('keyId');
  const key = params.get('key');

  if (!streamUrl || !keyId || !key) {
    console.error('Missing stream parameters');
    return;
  }

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    console.error('Browser not supported');
    return;
  }

  const video = document.querySelector('video');
  const player = new shaka.Player(video);
  const ui = new shaka.ui.Overlay(player, document.querySelector('.shaka-video-container'), video);

  ui.configure({
    controlPanelElements: [
      'play_pause',
      'time_and_duration',
      'mute',
      'volume',
      'spacer',
      'captions',
      'quality',
      'language',
      'picture_in_picture',
      'fullscreen',
      'overflow_menu'
    ],
    enableFullscreenOnRotation: true
  });

  player.configure({
    drm: {
      clearKeys: {
        [keyId]: key
      }
    },
    streaming: {
      lowLatencyMode: true,
      bufferingGoal: 15,
      rebufferingGoal: 2,
      bufferBehind: 15
    }
  });

  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['Referer'] = 'https://www.jiotv.com/';
    request.headers['User-Agent'] =
      'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
  });

  try {
    await player.load(streamUrl);
    video.muted = false;
    await video.play();
  } catch (e) {
    console.error('Playback error:', e);
  }

  video.addEventListener('play', () => {
    if (window.innerWidth <= 768 && !document.fullscreenElement) {
      video.requestFullscreen?.().catch(()=>{});
    }
  }, { once:true });

});
</script>

</body>
</html>
