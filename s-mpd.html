<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV Stream</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  background:#000;
  overflow:hidden;
}
.shaka-video-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}
</style>
</head>

<body>

<div class="shaka-video-container" data-shaka-player>
  <video autoplay playsinline></video>
</div>

<script>

document.addEventListener('DOMContentLoaded', async () => {

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    alert("Browser not supported");
    return;
  }

  // ✅ GET URL PARAMS
  const params = new URLSearchParams(window.location.search);
  const streamUrl = params.get('url');
  const keyId = params.get('keyId');
  const key = params.get('key');

  if (!streamUrl) {
    console.error("Stream URL missing");
    return;
  }

  const video = document.querySelector('video');
  const player = new shaka.Player(video);

  // ✅ CLEARKEY DRM
  if (keyId && key) {
    player.configure({
      drm: {
        clearKeys: {
          [keyId]: key
        }
      }
    });
  }

  // ✅ ERROR LOGGING
  player.addEventListener('error', e => {
    console.error("Shaka Error:", e.detail);
  });

  try {
    await player.load(streamUrl);
    console.log("Stream Loaded");

    // Try autoplay
    video.muted = true;
    await video.play();

  } catch (err) {
    console.error("Load failed:", err);
  }

});
</script>

</body>
</html>
