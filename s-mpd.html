<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
</head>

<body style="margin:0;background:#000;height:100vh;">

<iframe id="streamFrame"
allow="autoplay; encrypted-media"
allowfullscreen
style="border:none;width:100%;height:100%;">
</iframe>

<script>

const urlParams = new URLSearchParams(window.location.search);
const streamId = urlParams.get('id');
const playlist = urlParams.get('name') || "jspo";

if (!streamId) {
    console.error("Missing ID");
}

fetch(`https://raw.githubusercontent.com/Shubhamkur/json/refs/heads/main/${playlist}`)
.then(res => res.json())
.then(data => {

    const channel = data.find(ch => ch.id === streamId);

    if (!channel) {
        console.error("Channel not found");
        return;
    }

    const streamUrl = channel.url3 || channel.url2 || channel.url;

    // 🔥 LOAD YOUR WORKING PLAYER PAGE HERE
    document.getElementById("streamFrame").src =
        `player.html?url=${encodeURIComponent(streamUrl)}`;

})
.catch(err => console.error(err));

</script>

</body>
</html>
