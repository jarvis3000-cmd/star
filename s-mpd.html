<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream</title>
</head>

<body style="margin:0;background:#000;height:100vh;">

<iframe id="streamFrame"
allow="autoplay; encrypted-media"
allowfullscreen
style="border:none;width:100%;height:100%;">
</iframe>

<script>
const params = new URLSearchParams(window.location.search);

const url = params.get("url");
const keyId = params.get("keyId");
const key = params.get("key");

if (!url) {
    document.body.innerHTML =
        "<h2 style='color:white;text-align:center;margin-top:50px;'>Invalid Stream Data</h2>";
} else {

    const playerUrl =
        `player.html?url=${encodeURIComponent(url)}&keyId=${keyId}&key=${key}`;

    document.getElementById("streamFrame").src = playerUrl;
}
</script>

</body>
</html>
