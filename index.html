<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<style>
body { margin:0; background:#000; font-family:Arial; color:#fff; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; padding:12px; }
.card { background:#111; border-radius:10px; cursor:pointer; text-align:center; padding:10px; }
.logo { width:100%; height:90px; background-size:contain; background-repeat:no-repeat; background-position:center; }
.title { margin-top:8px; font-size:13px; }
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>

const PLAYLIST_NAME = "jspo";  // VERY IMPORTANT

fetch('https://raw.githubusercontent.com/Shubhamkur/json/refs/heads/main/jspo')
.then(res => res.json())
.then(data => {

    const grid = document.getElementById("grid");

    data.forEach(ch => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="logo" style="background-image:url('${ch.logo}')"></div>
            <div class="title">${ch.name}</div>
        `;

        card.onclick = () => {

    const params = new URLSearchParams({
        url: ch.url,
        keyId: ch.keyId,
        key: ch.key,
        name: ch.name
    });

    window.location.href = "player.html?" + params.toString();
};



        grid.appendChild(card);
    });

})
.catch(err => console.error("Channel load error:", err));

</script>

</body>
</html>
