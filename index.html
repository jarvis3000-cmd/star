<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV</title>

<link rel="icon" href="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#050509;
  --card:#0b0b12;
  --border:rgba(255,255,255,.08);
  --radius:18px;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:#fff;
}

header {
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:#07070c;
  border-bottom:1px solid var(--border);
}

header img { height:38px; }
header span { font-size:20px; font-weight:700; }

main {
  padding:14px;
  max-width:1600px;
  margin:auto;
}

/* CATEGORY BUTTONS */
#categories {
  text-align:center;
  margin-bottom:20px;
}

#categories button {
  background:linear-gradient(145deg,#ffeb3b,#fdd835);
  color:#000;
  border:none;
  padding:8px 18px;
  font-size:14px;
  margin:6px;
  cursor:pointer;
  border-radius:20px;
  font-weight:600;
}

/* GRID */
.grid {
  display:grid;
  gap:14px;
}

@media (max-width:600px) {
  .grid { grid-template-columns:repeat(2,1fr); }
}
@media (min-width:601px) {
  .grid { grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
}

/* CARD */
.card {
  background:var(--card);
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border);
  cursor:pointer;
  transition:transform .2s ease;
}

.card:active { transform:scale(.96); }

.logo {
  height:120px;
  background:#fff center/contain no-repeat;
}

.title {
  padding:8px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  background:rgba(0,0,0,.4);
}

/* MODAL PLAYER */
#playerModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:9999;
}

#playerBox {
  width:100%;
  height:100%;
}

#closeBtn {
  position:absolute;
  top:10px;
  right:10px;
  z-index:99999;
  background:#000;
  color:#fff;
  border:none;
  font-size:22px;
  padding:6px 10px;
  cursor:pointer;
  border-radius:8px;
}

video {
  width:100%;
  height:100%;
  background:#000;
}
</style>
</head>

<body>

<header>
  <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">
  <span>Cloud TV</span>
</header>

<main>

  <!-- CATEGORIES -->
  <div id="categories">
    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Sports')">Sports</button>
    <button onclick="filterCategory('Movies')">Movies</button>
    <button onclick="filterCategory('Entertainment')">Entertainment</button>
    <button onclick="filterCategory('Education')">Education</button>
  </div>

  <div id="channels" class="grid"></div>

</main>

<!-- PLAYER MODAL -->
<div id="playerModal">
  <button id="closeBtn" onclick="closePlayer()">✕</button>
  <div id="playerBox" class="shaka-video-container" data-shaka-player>
    <video autoplay muted playsinline></video>
  </div>
</div>

<script>
let allChannels = [];
let filteredChannels = [];
let player = null;
let ui = null;

fetch('./channels.json')
  .then(r => r.json())
  .then(data => {
    allChannels = data;
    filteredChannels = data;
    renderChannels(filteredChannels);
  });

function renderChannels(list) {
  const grid = document.getElementById('channels');
  grid.innerHTML = '';

  list.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openPlayer(ch);

    card.innerHTML = `
      <div class="logo" style="background-image:url('${ch.image || ''}')"></div>
      <div class="title">${ch.title || 'Live Channel'}</div>
    `;
    grid.appendChild(card);
  });
}

function filterCategory(cat) {
  if (cat === 'All') {
    filteredChannels = allChannels;
  } else {
    filteredChannels = allChannels.filter(c => c.category === cat);
  }
  renderChannels(filteredChannels);
}

/* ===== SHAKA PLAYER ===== */
async function openPlayer(ch) {
  document.getElementById('playerModal').style.display = 'block';

  shaka.polyfill.installAll();
  const video = document.querySelector('video');

  if (player) await player.destroy();

  player = new shaka.Player(video);
  ui = new shaka.ui.Overlay(player, document.getElementById('playerBox'), video);

  ui.configure({
    controlPanelElements: [
      'play_pause',
      'time_and_duration',
      'mute',
      'volume',
      'spacer',
      'quality',
      'fullscreen',
      'overflow_menu'
    ]
  });

  player.configure({
    drm: {
      clearKeys: {
        [ch.keyId]: ch.key
      }
    }
  });

  // REQUIRED HEADERS (Jio / Star)
  player.getNetworkingEngine().registerRequestFilter((type, request) => {
    request.headers['Referer'] = 'https://www.jiotv.com/';
    request.headers['User-Agent'] =
      'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
  });

  try {
    await player.load(ch.url);
    video.muted = false;
    await video.play();
  } catch (err) {
    console.error('Playback error:', err);
  }
}

async function closePlayer() {
  document.getElementById('playerModal').style.display = 'none';
  if (player) await player.destroy();
}
</script>

</body>
</html>
