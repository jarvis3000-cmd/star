<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud TV</title>
<style>
body { margin:0; background:#111; font-family:sans-serif; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:10px; }
.card { background:#1c1c1c; padding:10px; border-radius:8px; text-align:center; cursor:pointer; }
.card img { width:100%; height:100px; object-fit:contain; }
.card h3 { font-size:14px; color:#fff; margin-top:5px; }

#playerModal {
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:9999;
}
#playerFrame {
  width:100%;
  height:100%;
  border:none;
}
.closeBtn {
  position:absolute;
  top:10px;
  right:15px;
  color:white;
  font-size:22px;
  cursor:pointer;
  z-index:10000;
}
</style>
</head>
<body>

<div class="grid" id="channelGrid"></div>

<div id="playerModal">
  <div class="closeBtn" onclick="closePlayer()">✕</div>
  <iframe id="playerFrame"></iframe>
</div>

<script>

let currentList = [];

async function loadChannels() {
  const response = await fetch('channels.json');
  const data = await response.json();
  currentList = data;
  renderChannels();
}

function renderChannels() {
  const grid = document.getElementById('channelGrid');
  grid.innerHTML = '';

  currentList.forEach((ch, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openPlayer(index);

    card.innerHTML = `
      <img src="${ch.logo}">
      <h3>${ch.name}</h3>
    `;

    grid.appendChild(card);
  });
}

function openPlayer(index) {
  const ch = currentList[index];

  document.getElementById('playerFrame').src =
    `s-mpd.html?url=${encodeURIComponent(ch.url3)}&keyId=${ch.keyId}&key=${ch.key}`;

  document.getElementById('playerModal').style.display = 'block';
}

function closePlayer() {
  document.getElementById('playerFrame').src = '';
  document.getElementById('playerModal').style.display = 'none';
}

loadChannels();

</script>
</body>
</html>
