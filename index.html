<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cloud TV</title>

<link rel="icon" href="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- DASH + HLS -->
<script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --bg: #050509;
  --card: #0b0b12;
  --border: rgba(255,255,255,.08);
  --radius: 18px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(1200px 600px at top, #0b1a2a, transparent),
    radial-gradient(800px 400px at bottom, #020024, transparent),
    var(--bg);
  color: #fff;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(5,5,9,.65);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

header img {
  height: 40px;
}

header span {
  font-size: 20px;
  font-weight: 700;
}

/* MAIN */
main {
  padding: 14px;
  max-width: 1600px;
  margin: auto;
}

/* GRID */
.grid {
  display: grid;
  gap: 14px;
}

@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 601px) and (max-width: 1024px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1025px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}

/* CARD */
.card {
  background: linear-gradient(180deg, #101018, #07070c);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 10px 25px rgba(0,0,0,.55);
  cursor: pointer;
  transition: transform .25s ease;
}
.card:active { transform: scale(.96); }

/* LOGO */
.logo {
  height: 120px;
  background: #fff center/contain no-repeat;
}

/* TITLE */
.title {
  padding: 10px 8px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  background: rgba(0,0,0,.5);
  border-top: 1px solid var(--border);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* LOADING */
.loading {
  text-align: center;
  padding: 60px 20px;
  opacity: .75;
}

/* CATEGORY BUTTONS */
#categories button {
  background: linear-gradient(145deg, #ffeb3b, #fdd835);
  color: #000;
  border: none;
  padding: 8px 18px;
  font-size: 14px;
  margin: 6px;
  cursor: pointer;
  border-radius: 20px;
  font-weight: 600;
}

/* ===== MODAL PLAYER ===== */
#playerModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}

#playerBox {
  width: 90%;
  max-width: 1000px;
  background: #000;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
}

#playerBox video {
  width: 100%;
  height: auto;
  background: #000;
}

#closeBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  background: rgba(0,0,0,.7);
  color: #fff;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <img src="https://static.readdy.ai/image/0ece273271e400e488b9947cb1e99e9a/a79b6f32c71c4ee2094ead0eb9c84c9b.png">
  <span>Cloud TV</span>
</header>

<main>
  <div id="categories" style="text-align:center;margin-bottom:20px;">
    <button onclick="filterCategory('All')">All</button>
    <button onclick="filterCategory('Sports')">Sports</button>
    <button onclick="filterCategory('Movies')">Movies</button>
    <button onclick="filterCategory('Entertainment')">Entertainment</button>
    <button onclick="filterCategory('Education')">Education</button>
  </div>

  <div id="loading" class="loading">Loading channels…</div>
  <div id="channels" class="grid"></div>
</main>

<!-- MODAL -->
<div id="playerModal">
  <div id="playerBox">
    <button id="closeBtn" onclick="closePlayer()">✕</button>
    <video id="videoPlayer" controls autoplay playsinline></video>
  </div>
</div>

<script>
let allChannels = [];
let dashPlayer = null;
let hlsPlayer = null;

fetch('./channels.json')
  .then(res => res.json())
  .then(data => {
    allChannels = data;
    displayChannels(allChannels);
  })
  .catch(() => {
    document.getElementById('loading').innerText = 'Failed to load channels';
  });

function displayChannels(channels) {
  document.getElementById('loading').style.display = 'none';
  const grid = document.getElementById('channels');
  grid.innerHTML = '';

  channels.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openPlayer(ch);

    card.innerHTML = `
      <div class="logo" style="background-image:url('${ch.image || ''}')"></div>
      <div class="title">${ch.title || 'Live Channel'}</div>
    `;
    grid.appendChild(card);
  });
}

function filterCategory(cat) {
  if (cat === 'All') displayChannels(allChannels);
  else displayChannels(allChannels.filter(c => c.category === cat));
}

/* ===== PLAYER ===== */
function openPlayer(ch) {
  const modal = document.getElementById('playerModal');
  const video = document.getElementById('videoPlayer');

  modal.style.display = 'flex';
  video.pause();
  video.removeAttribute('src');
  video.load();

  if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
  if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }

  if (ch.url.endsWith('.mpd')) {
    dashPlayer = dashjs.MediaPlayer().create();
    dashPlayer.initialize(video, ch.url, true);

    if (ch.keyId && ch.key) {
      dashPlayer.setProtectionData({
        "org.w3.clearkey": {
          "clearkeys": {
            [ch.keyId]: ch.key
          }
        }
      });
    }
  }
  else if (ch.url.endsWith('.m3u8')) {
    if (Hls.isSupported()) {
      hlsPlayer = new Hls();
      hlsPlayer.loadSource(ch.url);
      hlsPlayer.attachMedia(video);
    } else {
      video.src = ch.url;
    }
  }
  else {
    video.src = ch.url;
  }
}

function closePlayer() {
  const modal = document.getElementById('playerModal');
  const video = document.getElementById('videoPlayer');

  video.pause();
  video.removeAttribute('src');
  video.load();
  modal.style.display = 'none';

  if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
  if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
}
</script>

</body>
</html>
